name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны, но начатый прерывать нельзя
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Проект живёт в подкаталоге репозитория, отсюда префикс путей
          NEXT_PUBLIC_BASE_PATH: /rbxdrop
          NEXT_PUBLIC_SITE_URL: https://kannurali.github.io/rbxdrop

      # Без этого файла Pages прогоняет сборку через Jekyll и выкидывает _next
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # С v4 скрытые файлы в артефакт не попадают, а .nojekyll как раз такой
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
